<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Parking - Camera Update</title>
  <style>
    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      background-color: #fcfbfa;
      margin: 0;
      padding: 16px;
      color: #333;
    }
    .app-container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(255, 102, 0, 0.08);
      max-width: 1500px;
      margin: 0 auto;
      overflow: hidden;
      border-top: 5px solid #ff6600;
    }
    .app-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 28px; border-bottom: 1px solid #f3e9e2;
    }
    .logo { max-width: 180px; height: auto; }
    .logo-fallback { font-weight: 700; color: #002d56; font-size: 20px; display: none; }
    .header-right { display: flex; align-items: center; gap: 16px; }
    .header-title { text-align: right; }
    .header-title h1 { margin: 0; font-size: 18px; color: #002d56; }
    .header-title .subtitle { font-size: 13px; color: #64748b; }
    .demo-tag { background-color: #ff6600; color: white; font-size: 11px; font-weight: bold; padding: 3px 8px; border-radius: 4px; margin-left: 8px; }
    .app-body { padding: 24px 28px 28px 28px; }

    /* ---------- KPIs ---------- */
    .kpis { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; margin-bottom: 24px; }
    .kpi {
      border-radius: 12px; padding: 14px 18px;
      background-color: #fdfaf7; border-left: 4px solid #cbd5e1;
    }
    .kpi h4 { margin: 0; font-size: 12px; color: #64748b; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
    .kpi p { margin: 4px 0 0 0; font-size: 28px; font-weight: 700; color: #002d56; }
    .kpi.total { background-color: #002d56; border-left-color: #ff6600; }
    .kpi.total h4 { color: #cbd5e1; }
    .kpi.total p { color: #ff6600; }
    .kpi.ok { border-left-color: #4caf50; }
    .kpi.avail { border-left-color: #ff6600; }
    .kpi.run { border-left-color: #185a9d; }
    .kpi.bad { border-left-color: #e53e3e; }

    /* ---------- Sections ---------- */
    .section { margin-bottom: 28px; }
    .section-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 12px; }
    .section-head h2 { margin: 0; font-size: 18px; color: #002d56; }
    .section-head h2 small { font-size: 13px; color: #94a3b8; font-weight: 500; margin-left: 6px; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; }

    /* ---------- Buttons ---------- */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 10px 16px; border-radius: 8px; border: none;
      font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer;
      transition: background-color 0.2s, border-color 0.2s;
      white-space: nowrap;
    }
    .btn-primary { background-color: #ff6600; color: white; box-shadow: 0 4px 10px rgba(255, 102, 0, 0.15); }
    .btn-primary:hover { background-color: #e65c00; }
    .btn-navy { background-color: #002d56; color: white; }
    .btn-navy:hover { background-color: #013b70; }
    .btn-secondary { background-color: white; color: #002d56; border: 2px solid #cbd5e1; padding: 8px 14px; }
    .btn-secondary:hover { border-color: #002d56; }
    .btn-danger { background-color: white; color: #c53030; border: 2px solid #fed7d7; padding: 8px 14px; }
    .btn-danger:hover { border-color: #e53e3e; }
    .btn:disabled { background-color: #e2e8f0 !important; color: #94a3b8 !important; border-color: #e2e8f0 !important; cursor: not-allowed; box-shadow: none !important; }
    .btn-icon { background: none; border: none; cursor: pointer; font-size: 15px; padding: 6px 8px; border-radius: 6px; color: #64748b; }
    .btn-icon:hover { background-color: #f3e9e2; color: #002d56; }
    .btn-icon:disabled { opacity: 0.3; cursor: not-allowed; background: none; }

    /* ---------- Tables ---------- */
    .table-wrap { border: 2px solid #f3e9e2; border-radius: 10px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th {
      text-align: left; padding: 10px 12px; background-color: #fdfaf7;
      color: #ff6600; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em;
      border-bottom: 2px solid #f3e9e2; white-space: nowrap;
    }
    td { padding: 10px 12px; border-bottom: 1px solid #f3e9e2; vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tbody tr:hover { background-color: #fffcf8; }
    tr.selected { background-color: #fffaf0 !important; }
    .cam-link { color: inherit; text-decoration: none; border-bottom: 1px dashed #cbd5e1; }
    .cam-link:hover { color: #ff6600; border-bottom-color: #ff6600; }
    .mono { font-family: Consolas, 'Courier New', monospace; font-weight: 600; color: #002d56; }
    .muted { color: #94a3b8; }
    .small { font-size: 12px; }
    .empty { text-align: center; padding: 30px; color: #94a3b8; }
    input[type="checkbox"] { width: 17px; height: 17px; accent-color: #ff6600; cursor: pointer; }

    /* ---------- Status ---------- */
    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; white-space: nowrap;
    }
    .b-idle { background-color: #edf2f7; color: #64748b; }
    .b-checking, .b-queued { background-color: #e2f0fe; color: #185a9d; }
    .b-current, .b-res-success { background-color: #d4edda; color: #155724; }
    .b-available { background-color: #fff1e6; color: #c26100; }
    .b-updating { background-color: #ff6600; color: white; }
    .b-offline { background-color: #edf2f7; color: #4a5568; }
    .b-error, .b-res-failed { background-color: #f8d7da; color: #721c24; }
    .b-res-current { background-color: #edf2f7; color: #4a5568; }
    .status-detail { font-size: 12px; color: #64748b; margin-top: 4px; max-width: 420px; word-break: break-word; }
    .b-error + .status-detail, .b-offline + .status-detail { color: #c53030; }
    .bar { height: 5px; background-color: #f3e9e2; border-radius: 3px; margin-top: 6px; overflow: hidden; max-width: 200px; }
    .bar .fill { height: 100%; background-color: #ff6600; transition: width 0.4s; }
    .bar.indeterminate .fill { width: 35% !important; animation: slide 1.2s ease-in-out infinite; }
    @keyframes slide { 0% { margin-left: -35%; } 100% { margin-left: 100%; } }
    .spinner {
      width: 11px; height: 11px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.4); border-top-color: currentColor;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .filter {
      padding: 9px 12px; border: 2px solid #f3e9e2; border-radius: 8px;
      font-size: 14px; font-family: inherit; min-width: 240px; background-color: #fdfdfd;
    }
    .filter:focus, textarea:focus, .field input:focus, .field select:focus { border-color: #ff6600; outline: none; }

    /* ---------- Dialogs ---------- */
    .dimmer {
      position: fixed; inset: 0; background-color: rgba(0,0,0,0.6);
      z-index: 999; display: none; justify-content: center; align-items: center;
      padding: 20px; box-sizing: border-box;
    }
    .dimmer.show { display: flex; }
    .dialog {
      background: white; border-radius: 16px; border-top: 5px solid #ff6600;
      max-width: 560px; width: 100%; padding: 24px; box-sizing: border-box;
      max-height: 90vh; overflow-y: auto;
    }
    .dialog h3 { margin: 0 0 8px 0; color: #002d56; }
    .dialog p { margin: 0 0 14px 0; color: #4a5568; font-size: 14px; line-height: 1.5; }
    .dialog textarea {
      width: 100%; min-height: 180px; box-sizing: border-box;
      padding: 12px; border: 2px solid #f3e9e2; border-radius: 8px;
      font-family: Consolas, 'Courier New', monospace; font-size: 14px; resize: vertical;
    }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
    .hint { background-color: #fdfaf7; border-left: 4px solid #ff6600; border-radius: 6px; padding: 10px 12px; font-size: 13px; color: #4a5568; margin-bottom: 14px; }
    .hint code { background: #f3e9e2; padding: 1px 5px; border-radius: 4px; }
    .warn { background-color: #fff5f5; border-left-color: #e53e3e; color: #721c24; }
    .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .field label { display: block; margin-bottom: 6px; font-weight: 600; color: #ff6600; font-size: 13px; }
    .field input, .field select {
      width: 100%; box-sizing: border-box; padding: 10px; border: 2px solid #f3e9e2; border-radius: 8px;
      font-size: 14px; font-family: inherit; background-color: #fdfdfd;
    }
    .field small { display: block; margin-top: 4px; color: #94a3b8; font-size: 12px; }
    .field.full { grid-column: span 2; }
    .confirm-list { max-height: 200px; overflow-y: auto; margin: 0 0 10px 0; padding-left: 20px; font-size: 14px; color: #002d56; }

    .toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px);
      background-color: #002d56; color: white; padding: 12px 20px; border-radius: 10px;
      font-size: 14px; font-weight: 600; box-shadow: 0 8px 25px rgba(0, 45, 86, 0.3);
      transition: transform 0.3s, opacity 0.3s; z-index: 1000;
      opacity: 0; pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .offline-banner { display: none; background-color: #f8d7da; color: #721c24; padding: 10px 28px; font-weight: 600; font-size: 14px; }
    .offline-banner.show { display: block; }

    @media (max-width: 900px) {
      .kpis { grid-template-columns: repeat(2, 1fr); }
      .fields { grid-template-columns: 1fr; }
      .field.full { grid-column: auto; }
      .app-body { padding: 18px; }
    }

    /* ---------- Language ---------- */
    .lang-switch { display: flex; border: 2px solid #cbd5e1; border-radius: 8px; overflow: hidden; }
    .lang-switch button {
      background: white; border: none; padding: 7px 12px; cursor: pointer;
      font-size: 13px; font-weight: 700; font-family: inherit; color: #64748b;
    }
    .lang-switch button.active { background-color: #002d56; color: white; }
  </style>
</head>
<body>

<div class="app-container">
  <div class="app-header">
    <img src="https://www.smartparking.com/wp-content/uploads/2025/04/logo.svg" alt="Smart Parking Logo" class="logo"
         onerror="this.style.display='none'; document.getElementById('logoFallback').style.display='block';">
    <div id="logoFallback" class="logo-fallback">Smart Parking</div>
    <div class="header-right">
      <div class="lang-switch">
        <button data-lang="de" onclick="setLang('de')">DE</button>
        <button data-lang="en" onclick="setLang('en')">EN</button>
      </div>
      <button class="btn btn-secondary" onclick="openSettings()" data-i18n="settings_btn"></button>
      <div class="header-title">
        <h1><span data-i18n="app_title"></span><span id="demoTag" class="demo-tag" style="display:none;">DEMO</span></h1>
        <span class="subtitle">ARVOO Ruby</span>
      </div>
    </div>
  </div>
  <div class="offline-banner" id="offlineBanner" data-i18n="offline_banner"></div>

  <div class="app-body">

    <div class="kpis">
      <div class="kpi total"><h4 data-i18n="kpi_total"></h4><p id="kTotal">0</p></div>
      <div class="kpi ok"><h4 data-i18n="kpi_ok"></h4><p id="kOk">0</p></div>
      <div class="kpi avail"><h4 data-i18n="kpi_avail"></h4><p id="kAvail">0</p></div>
      <div class="kpi run"><h4 data-i18n="kpi_run"></h4><p id="kRun">0</p></div>
      <div class="kpi bad"><h4 data-i18n="kpi_bad"></h4><p id="kBad">0</p></div>
    </div>

    <div class="section">
      <div class="section-head">
        <h2><span data-i18n="cams_title"></span> <small id="selInfo"></small></h2>
        <div class="toolbar">
          <button class="btn btn-secondary" onclick="openAdd()" data-i18n="btn_add"></button>
          <button class="btn btn-navy" id="btnCheckAll" onclick="checkCams(allIps())" data-i18n="btn_check_all"></button>
          <button class="btn btn-primary" id="btnUpdateSel" onclick="askUpdate(selectedIps())" data-i18n="btn_update_sel"></button>
          <button class="btn btn-primary" id="btnUpdateAvail" onclick="askUpdate(availableIps())" data-i18n="btn_update_avail"></button>
          <button class="btn btn-primary" id="btnUpdateAll" onclick="askUpdate(idleIps())" data-i18n="btn_update_all"></button>
          <button class="btn btn-danger" id="btnDeleteSel" onclick="askDelete(selectedIps())" data-i18n="btn_remove"></button>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th style="width:30px;"><input type="checkbox" id="selAll" onclick="toggleAll(this.checked)"></th>
              <th data-i18n="th_ip"></th>
              <th data-i18n="th_name"></th>
              <th data-i18n="th_status"></th>
              <th data-i18n="th_version"></th>
              <th data-i18n="th_avail"></th>
              <th data-i18n="th_serial"></th>
              <th data-i18n="th_checked"></th>
              <th data-i18n="th_updated"></th>
              <th style="width:110px;"></th>
            </tr>
          </thead>
          <tbody id="camBody"></tbody>
        </table>
      </div>
    </div>

    <div class="section" style="margin-bottom:0;">
      <div class="section-head">
        <h2><span data-i18n="log_title"></span> <small id="logInfo"></small></h2>
        <div class="toolbar">
          <input class="filter" id="logFilter" data-i18n-ph="log_filter" oninput="renderLog()">
          <a class="btn btn-secondary" href="/api/log.csv" download style="text-decoration:none;" data-i18n="btn_csv"></a>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th data-i18n="th_time"></th>
              <th data-i18n="th_ip"></th>
              <th data-i18n="th_name"></th>
              <th data-i18n="th_serial"></th>
              <th data-i18n="th_before"></th>
              <th data-i18n="th_after"></th>
              <th data-i18n="th_result"></th>
              <th data-i18n="th_message"></th>
            </tr>
          </thead>
          <tbody id="logBody"></tbody>
        </table>
      </div>
    </div>

  </div>
</div>

<div class="dimmer" id="addDialog">
  <div class="dialog">
    <h3 data-i18n="add_title"></h3>
    <p data-i18n="add_text"></p>
    <div class="hint" data-i18n="add_hint"></div>
    <textarea id="addText" data-i18n-ph="add_placeholder"></textarea>
    <div class="dialog-actions">
      <button class="btn btn-secondary" onclick="closeDialog('addDialog')" data-i18n="btn_cancel"></button>
      <button class="btn btn-primary" onclick="addCams()" data-i18n="btn_add_confirm"></button>
    </div>
  </div>
</div>

<div class="dimmer" id="confirmDialog">
  <div class="dialog">
    <h3 id="confirmTitle"></h3>
    <p id="confirmText"></p>
    <ul class="confirm-list" id="confirmList"></ul>
    <div class="hint warn" id="confirmWarn" data-i18n="update_warn"></div>
    <div class="dialog-actions">
      <button class="btn btn-secondary" onclick="closeDialog('confirmDialog')" data-i18n="btn_cancel"></button>
      <button class="btn btn-primary" id="confirmOk"></button>
    </div>
  </div>
</div>

<div class="dimmer" id="settingsDialog">
  <div class="dialog">
    <h3 data-i18n="settings_title"></h3>
    <p data-i18n="settings_text"></p>
    <div class="fields">
      <div class="field"><label data-i18n="s_user"></label><input id="sUser"></div>
      <div class="field"><label data-i18n="s_password"></label><input id="sPassword" type="password" data-i18n-ph="s_password_ph"><small id="sPwState"></small></div>
      <div class="field"><label>Port</label><input id="sPort" type="number"></div>
      <div class="field"><label data-i18n="s_prefix"></label><input id="sPrefix"></div>
      <div class="field"><label data-i18n="s_auth"></label>
        <select id="sAuth"><option value="basic">Basic</option><option value="digest">Digest</option></select></div>
      <div class="field"><label data-i18n="s_parallel"></label><input id="sParallel" type="number" min="1" max="20">
        <small data-i18n="s_parallel_hint"></small></div>
      <div class="field full"><label>Format perform_update</label>
        <select id="sBody"></select>
        <small data-i18n="s_format_hint"></small></div>
    </div>
    <div class="dialog-actions">
      <button class="btn btn-secondary" onclick="closeDialog('settingsDialog')" data-i18n="btn_cancel"></button>
      <button class="btn btn-primary" onclick="saveSettings()" data-i18n="btn_save"></button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>

var state = { cameras: [], log: [], settings: {} };
var selected = {};
var lang = 'en';

var RESULTS = {
  'success': 'success', 'erfolgreich': 'success',
  'up to date': 'current', 'bereits aktuell': 'current',
  'failed': 'failed', 'fehlgeschlagen': 'failed'
};

function t(key) {
  var text = (I18N[lang] && I18N[lang][key]) || I18N.en[key] || key;
  var args = Array.prototype.slice.call(arguments, 1);
  return text.replace(/\{(\d+)\}/g, function(m, i) { return args[i] !== undefined ? args[i] : m; });
}

function setLang(l) {
  lang = I18N[l] ? l : 'en';
  try { localStorage.setItem('lang', lang); } catch (e) {}
  document.documentElement.lang = lang;
  document.title = 'Smart Parking - ' + t('app_title');
  document.querySelectorAll('[data-i18n]').forEach(function(el) { el.innerHTML = t(el.getAttribute('data-i18n')); });
  document.querySelectorAll('[data-i18n-ph]').forEach(function(el) { el.placeholder = t(el.getAttribute('data-i18n-ph')); });
  document.querySelectorAll('.lang-switch button').forEach(function(b) { b.classList.toggle('active', b.getAttribute('data-lang') === lang); });
  var sel = document.getElementById('sBody');
  var current = sel.value;
  sel.innerHTML = ['auto'].concat(FORMATS).map(function(f) { return '<option value="' + f + '">' + esc(t('fmt_' + f)) + '</option>'; }).join('');
  if (current) sel.value = current;
  render();
}

function message(d) {
  if (!d) return '';
  if (typeof d === 'string') return d;
  var args = (d.args || []).slice();
  if (d.key === 'phase') args[0] = t('phase_' + args[0]) !== 'phase_' + args[0] ? t('phase_' + args[0]) : args[0];
  if (d.key === 'detecting_format') args[0] = t('fmt_' + args[0]);
  return t.apply(null, ['msg_' + d.key].concat(args));
}

function post(url, data) {
  return fetch(url, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data || {})
  }).then(function(r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  });
}

function refresh() {
  return fetch('/api/state', { cache: 'no-store' })
    .then(function(r) { return r.json(); })
    .then(function(s) {
      state = s;
      document.getElementById('offlineBanner').classList.remove('show');
      render();
    })
    .catch(function() { document.getElementById('offlineBanner').classList.add('show'); });
}

function poll() { refresh().then(function() { setTimeout(poll, POLL_MS); }); }

function render() {
  document.getElementById('demoTag').style.display = state.demo ? 'inline' : 'none';
  var cams = state.cameras.slice().sort(function(a, b) { return ipKey(a.ip).localeCompare(ipKey(b.ip)); });

  Object.keys(selected).forEach(function(ip) { if (!cams.some(function(c) { return c.ip === ip; })) delete selected[ip]; });

  var count = function(fn) { return cams.filter(fn).length; };
  setText('kTotal', cams.length);
  setText('kOk', count(function(c) { return c.status === 'current'; }));
  setText('kAvail', count(function(c) { return c.status === 'available'; }));
  setText('kRun', count(function(c) { return c.busy; }));
  setText('kBad', count(function(c) { return c.status === 'offline' || c.status === 'error'; }));

  var body = cams.length ? cams.map(camRow).join('') : '<tr><td colspan="10" class="empty">' + esc(t('empty_cams')) + '</td></tr>';
  setHtml('camBody', body);

  var sel = selectedIps();
  setText('selInfo', sel.length ? t('sel_info', sel.length) : t('total_info', cams.length));
  document.getElementById('selAll').checked = cams.length > 0 && sel.length === cams.length;
  document.getElementById('btnUpdateSel').disabled = !sel.length;
  document.getElementById('btnDeleteSel').disabled = !sel.length;
  document.getElementById('btnUpdateAvail').disabled = !availableIps().length;
  document.getElementById('btnUpdateAll').disabled = !idleIps().length;
  document.getElementById('btnCheckAll').disabled = !cams.length;

  renderLog();
}

function camRow(c) {
  var spin = c.status === 'checking' || c.status === 'updating';
  var badge = '<span class="badge b-' + c.status + '">' + (spin ? '<span class="spinner"></span>' : '') + esc(t('st_' + c.status)) + '</span>';
  var bar = '';
  if (c.status === 'updating') {
    var known = typeof c.progress === 'number';
    bar = '<div class="bar' + (known ? '' : ' indeterminate') + '"><div class="fill" style="width:' + (known ? c.progress : 0) + '%"></div></div>';
  }
  var showDetail = c.detail && c.status !== 'current' && c.status !== 'available';
  var detail = showDetail ? '<div class="status-detail">' + esc(message(c.detail)) + '</div>' : '';
  var dash = '<span class="muted">–</span>';
  var avail = dash;
  if (c.update_available) {
    avail = '<span style="color:#c26100;" title="' + esc(t('title_reports') + (c.update_raw || c.update_available)) + '">' + esc(c.update_available) + '</span>';
    if (c.update_raw && c.update_raw !== c.update_available) {
      avail += '<div class="small muted" style="font-family:inherit; font-weight:400;">“' + esc(c.update_raw) + '”</div>';
    }
  }
  var ip = esc(c.ip);
  var dis = c.busy ? 'disabled' : '';
  return '<tr class="' + (selected[c.ip] ? 'selected' : '') + '">' +
    '<td><input type="checkbox" ' + (selected[c.ip] ? 'checked' : '') + ' onclick="toggleSel(\'' + ip + '\', this.checked)"></td>' +
    '<td class="mono"><a class="cam-link" href="http://' + ip + '/" target="_blank" rel="noopener" title="' + esc(t('title_open')) + '">' + ip + '</a>' +
      (c.own_password ? ' <span title="' + esc(t('title_own_pw')) + '">🔑</span>' : '') + '</td>' +
    '<td>' + (c.name ? esc(c.name) : dash) + '</td>' +
    '<td>' + badge + detail + bar + '</td>' +
    '<td class="mono">' + (c.version ? esc(c.version) : dash) + '</td>' +
    '<td class="mono">' + avail + '</td>' +
    '<td class="small">' + (c.serial ? esc(c.serial) : dash) + '</td>' +
    '<td class="small">' + fmtTime(c.last_check) + '</td>' +
    '<td class="small">' + fmtTime(c.last_update) + '</td>' +
    '<td style="text-align:right; white-space:nowrap;">' +
      '<button class="btn-icon" title="' + esc(t('title_check')) + '" ' + dis + ' onclick="checkCams([\'' + ip + '\'])">🔍</button>' +
      '<button class="btn-icon" title="' + esc(t('title_update')) + '" ' + dis + ' onclick="askUpdate([\'' + ip + '\'])">⬆</button>' +
      '<button class="btn-icon" title="' + esc(t('title_remove')) + '" ' + dis + ' onclick="askDelete([\'' + ip + '\'])">✕</button>' +
    '</td></tr>';
}

function renderLog() {
  var q = document.getElementById('logFilter').value.trim().toLowerCase();
  var rows = state.log.filter(function(e) {
    if (!q) return true;
    var res = RESULTS[e.result];
    return Object.keys(e).some(function(k) { return String(e[k] || '').toLowerCase().indexOf(q) >= 0; }) ||
      (res && t('res_' + res).toLowerCase().indexOf(q) >= 0);
  });
  var ok = state.log.filter(function(e) { return RESULTS[e.result] === 'success'; }).length;
  setText('logInfo', t('log_info', state.log.length, ok));
  var html = rows.length ? rows.map(function(e) {
    var res = RESULTS[e.result];
    return '<tr>' +
      '<td class="small" style="white-space:nowrap;">' + fmtTime(e.time) + '</td>' +
      '<td class="mono">' + esc(e.ip) + '</td>' +
      '<td>' + esc(e.name || '') + '</td>' +
      '<td class="small">' + esc(e.serial || '') + '</td>' +
      '<td class="mono">' + esc(e.version_before || '–') + '</td>' +
      '<td class="mono">' + esc(e.version_after || '–') + '</td>' +
      '<td><span class="badge b-res-' + (res || 'current') + '">' + esc(res ? t('res_' + res) : e.result || '') + '</span></td>' +
      '<td class="small">' + esc(e.message || '') + '</td></tr>';
  }).join('') : '<tr><td colspan="8" class="empty">' + esc(q ? t('no_match') : t('empty_log')) + '</td></tr>';
  setHtml('logBody', html);
}

function fmtTime(v) {
  if (!v) return '<span class="muted">–</span>';
  var m = String(v).match(/^(\d{4})-(\d{2})-(\d{2}) (\d{2}:\d{2})/);
  if (!m) return esc(v);
  return lang === 'de' ? m[3] + '.' + m[2] + '.' + m[1] + ' ' + m[4] : m[1] + '-' + m[2] + '-' + m[3] + ' ' + m[4];
}

function ipKey(ip) {
  return ip.split(/[.:]/).map(function(p) { return /^\d+$/.test(p) ? ('00000' + p).slice(-5) : p; }).join('.');
}

function setText(id, v) { var el = document.getElementById(id); if (el.innerText !== String(v)) el.innerText = v; }
function setHtml(id, h) { var el = document.getElementById(id); if (el.innerHTML !== h) el.innerHTML = h; }
function esc(v) {
  return String(v).replace(/[&<>"']/g, function(c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function toast(msg) {
  var el = document.getElementById('toast');
  el.innerText = msg;
  el.classList.add('show');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(function() { el.classList.remove('show'); }, 3500);
}

function allIps() { return state.cameras.map(function(c) { return c.ip; }); }
function selectedIps() { return Object.keys(selected); }
function idleIps() { return state.cameras.filter(function(c) { return !c.busy; }).map(function(c) { return c.ip; }); }
function availableIps() { return state.cameras.filter(function(c) { return c.status === 'available' && !c.busy; }).map(function(c) { return c.ip; }); }

function toggleSel(ip, on) { if (on) selected[ip] = true; else delete selected[ip]; render(); }
function toggleAll(on) { selected = {}; if (on) allIps().forEach(function(ip) { selected[ip] = true; }); render(); }

function checkCams(ips, quiet) {
  return post('/api/check', { ips: ips }).then(function(r) {
    if (!quiet) toast(t('t_checking', r.started.length));
    refresh();
  });
}

function askUpdate(ips) {
  if (!ips.length) return;
  document.getElementById('confirmTitle').innerText = t('update_title');
  document.getElementById('confirmText').innerText = t('update_text', ips.length, state.settings.parallel || 3);
  document.getElementById('confirmList').innerHTML = ips.map(function(ip) {
    var c = state.cameras.filter(function(x) { return x.ip === ip; })[0];
    return '<li><span class="mono">' + esc(ip) + '</span>' + (c && c.name ? ' – ' + esc(c.name) : '') + '</li>';
  }).join('');
  document.getElementById('confirmWarn').style.display = '';
  document.getElementById('confirmOk').innerText = t('btn_start_update');
  document.getElementById('confirmOk').onclick = function() {
    closeDialog('confirmDialog');
    post('/api/update', { ips: ips }).then(function(r) {
      toast(t('t_updates', r.started.length));
      selected = {};
      refresh();
    });
  };
  openDialog('confirmDialog');
}

function askDelete(ips) {
  if (!ips.length) return;
  document.getElementById('confirmTitle').innerText = t('remove_title');
  document.getElementById('confirmText').innerText = t('remove_text', ips.length);
  document.getElementById('confirmList').innerHTML = ips.map(function(ip) { return '<li class="mono">' + esc(ip) + '</li>'; }).join('');
  document.getElementById('confirmWarn').style.display = 'none';
  document.getElementById('confirmOk').innerText = t('btn_remove');
  document.getElementById('confirmOk').onclick = function() {
    closeDialog('confirmDialog');
    post('/api/cameras/delete', { ips: ips }).then(function() { ips.forEach(function(ip) { delete selected[ip]; }); refresh(); });
  };
  openDialog('confirmDialog');
}

function openAdd() { document.getElementById('addText').value = ''; openDialog('addDialog'); document.getElementById('addText').focus(); }

function addCams() {
  post('/api/cameras', { text: document.getElementById('addText').value }).then(function(r) {
    closeDialog('addDialog');
    var msg = t('t_added', r.added);
    if (r.updated) msg += t('t_existing', r.updated);
    if (r.invalid.length) msg += t('t_invalid', r.invalid.length, r.invalid.join(', '));
    if (r.added) msg += t('t_checking_new');
    toast(msg);
    if (r.added_ips && r.added_ips.length) checkCams(r.added_ips, true); else refresh();
  });
}

function openSettings() {
  var s = state.settings;
  document.getElementById('sUser').value = s.user || '';
  document.getElementById('sPassword').value = '';
  document.getElementById('sPwState').innerText = s.password_set ? t('pw_set') : t('pw_missing');
  document.getElementById('sPort').value = s.port || '';
  document.getElementById('sPrefix').value = s.api_prefix || '';
  document.getElementById('sAuth').value = s.auth || 'basic';
  document.getElementById('sParallel').value = s.parallel || 3;
  document.getElementById('sBody').value = s.perform_update_body || 'json';
  openDialog('settingsDialog');
}

function saveSettings() {
  var data = {
    user: document.getElementById('sUser').value,
    port: document.getElementById('sPort').value,
    api_prefix: document.getElementById('sPrefix').value,
    auth: document.getElementById('sAuth').value,
    parallel: document.getElementById('sParallel').value,
    perform_update_body: document.getElementById('sBody').value
  };
  var pw = document.getElementById('sPassword').value;
  if (pw) data.password = pw;
  post('/api/settings', data).then(function() {
    closeDialog('settingsDialog');
    toast(t('t_saved'));
    refresh();
  });
}

function openDialog(id) { document.getElementById(id).classList.add('show'); }
function closeDialog(id) { document.getElementById(id).classList.remove('show'); }
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') ['addDialog', 'confirmDialog', 'settingsDialog'].forEach(closeDialog);
});

(function() {
  var saved = null;
  try { saved = localStorage.getItem('lang'); } catch (e) {}
  setLang(saved || ((navigator.language || '').toLowerCase().indexOf('de') === 0 ? 'de' : 'en'));
})();
poll();
</script>
