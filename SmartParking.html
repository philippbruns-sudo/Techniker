<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ParkPilot</title>
<style>
  :root{
    --bg:#0e1320; --panel:#192033; --panel2:#222b42; --text:#e9edf5; --muted:#8b97ae;
    --asphalt:#2b3039; --line:rgba(240,240,240,.8); --accent:#3ddc97; --warn:#ffb020;
    --bad:#ff4d5e; --ev:#3aa8ff; --dis:#6f8cff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
  body{min-height:100vh}
  #app{max-width:980px;margin:0 auto;padding:12px 16px 28px}
  button{font:inherit;color:inherit;cursor:pointer;border:0}

  /* ---------- Kopfzeile / HUD ---------- */
  header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  h1{font-size:21px;margin:0;letter-spacing:.4px}
  h1 span{color:var(--accent)}
  .hud{display:flex;gap:6px;flex-wrap:wrap}
  .stat{background:var(--panel);border-radius:10px;padding:5px 10px;min-width:70px}
  .stat small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.7px}
  .stat b{font-size:16px;font-variant-numeric:tabular-nums}
  .hearts i{font-style:normal;color:var(--bad)}
  .hearts i.off{color:#3b4357}
  .tools{display:flex;gap:6px}
  .btn{background:var(--panel2);border-radius:10px;padding:8px 12px;font-weight:600}
  .btn:hover{filter:brightness(1.15)}
  .btn.ai{background:linear-gradient(135deg,#3ddc97,#2aa7ff);color:#08121f}
  .btn.ai:disabled{opacity:.35;cursor:not-allowed;filter:none}

  /* ---------- Parkhaus ---------- */
  #garage{position:relative;background:var(--asphalt);border-radius:14px;padding:12px 14px;
    box-shadow:inset 0 0 0 3px #3b424f, 0 10px 30px rgba(0,0,0,.35)}
  .row{display:grid;grid-template-columns:repeat(8,1fr)}
  .spot{position:relative;aspect-ratio:1/1.7;border-left:2px solid var(--line);cursor:pointer;transition:box-shadow .15s,opacity .15s}
  .spot:last-child{border-right:2px solid var(--line)}
  .row.top .spot{border-top:2px solid var(--line)}
  .row.bottom .spot{border-bottom:2px solid var(--line)}
  .spot.t-ev{background:rgba(58,168,255,.13)}
  .spot.t-dis{background:rgba(111,140,255,.16)}
  .spot.t-compact{background:repeating-linear-gradient(135deg,transparent 0 9px,rgba(255,255,255,.035) 9px 18px)}
  .ground{position:absolute;left:0;right:0;bottom:8%;text-align:center;font-weight:800;opacity:.4;
    font-size:clamp(12px,3vw,24px);pointer-events:none}
  .sensor{position:absolute;top:5px;left:50%;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;
    background:var(--accent);box-shadow:0 0 8px var(--accent);z-index:3}
  .spot.occ .sensor{background:var(--bad);box-shadow:0 0 8px var(--bad)}
  .spot.broken .sensor{background:var(--warn);box-shadow:0 0 10px var(--warn);animation:blink .6s infinite}
  .slot{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  .tbar{position:absolute;left:12%;right:12%;bottom:4px;height:4px;border-radius:3px;background:rgba(0,0,0,.35);display:none}
  .tbar i{display:block;height:100%;border-radius:3px;background:var(--accent)}
  .spot.occ .tbar,.spot.repairing .tbar{display:block}
  .spot.repairing .tbar i{background:var(--warn)}
  .flag{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;
    font-size:clamp(16px,4vw,28px);z-index:4}
  .spot.illegal .flag{animation:pulse 1s infinite}
  .spot.broken:not(.repairing) .flag{animation:blink 1s infinite}
  .spot.ok{box-shadow:inset 0 0 0 3px var(--accent), inset 0 0 18px rgba(61,220,151,.35)}
  .spot.no{opacity:.4}
  .spot.shake{animation:shake .35s}
  .lane{height:54px;position:relative;display:flex;align-items:center;justify-content:space-around;
    color:rgba(255,255,255,.18);font-size:22px;pointer-events:none}
  .lane::before{content:"";position:absolute;left:4%;right:4%;top:50%;height:3px;margin-top:-1.5px;
    background:repeating-linear-gradient(90deg,rgba(255,214,0,.55) 0 22px,transparent 22px 40px)}
  .lane span{position:relative;top:-14px}

  /* ---------- Autos (Draufsicht) ---------- */
  .car{position:relative;width:64%;border-radius:11px 11px 8px 8px;background:var(--c);
    box-shadow:0 3px 0 rgba(0,0,0,.35), inset 0 0 0 2px rgba(255,255,255,.18), inset 0 -6px 0 rgba(0,0,0,.12)}
  .car::before{content:"";position:absolute;left:13%;right:13%;top:17%;height:19%;background:#17202e;border-radius:6px 6px 2px 2px;opacity:.88}
  .car::after{content:"";position:absolute;left:15%;right:15%;bottom:11%;height:12%;background:#17202e;border-radius:2px 2px 5px 5px;opacity:.72}
  .car .badge{position:absolute;left:50%;top:56%;transform:translate(-50%,-50%);font-size:12px;z-index:2;
    background:rgba(0,0,0,.45);border-radius:6px;padding:0 2px;line-height:16px}
  .spot .car.s{height:50%} .spot .car.m{height:64%} .spot .car.b{height:80%;width:72%}
  .queue .car{width:30px} .queue .car.s{height:44px} .queue .car.m{height:54px} .queue .car.b{height:66px;width:34px}
  .car.fly{position:fixed;z-index:50;transition:left .5s cubic-bezier(.5,.1,.3,1),top .5s cubic-bezier(.5,.1,.3,1),width .5s,height .5s;pointer-events:none}
  .car.ghost{position:fixed;z-index:40;pointer-events:none;transition:transform .6s ease-in,opacity .6s ease-in}

  /* ---------- Einfahrt ---------- */
  .entry{display:grid;grid-template-columns:auto 1fr;gap:12px;margin-top:12px;align-items:stretch}
  .board{background:#05070b;border-radius:10px;padding:8px 12px;font-family:"Courier New",monospace;color:#ffb020;
    text-shadow:0 0 6px rgba(255,176,32,.7);border:2px solid #2a303c;min-width:150px}
  .board .big{font-size:26px;font-weight:700;letter-spacing:2px}
  .board .small{font-size:12px;color:#7fe7b5;text-shadow:0 0 6px rgba(61,220,151,.6)}
  .board .lbl{font-size:10px;color:#6a7488;text-shadow:none;letter-spacing:1px}
  .lanebox{background:var(--panel);border-radius:12px;padding:8px 10px;position:relative;overflow:hidden}
  .lanebox .lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;display:flex;justify-content:space-between}
  .queue{display:flex;gap:6px;min-height:104px;align-items:flex-end;padding-top:4px}
  .qitem{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;padding:6px 4px 4px;border-radius:10px;
    cursor:pointer;width:54px;flex:0 0 auto;background:rgba(255,255,255,.03);border:2px solid transparent;transition:transform .15s}
  .qitem:hover{transform:translateY(-2px)}
  .qitem.sel{border-color:var(--accent);background:rgba(61,220,151,.09)}
  .qitem.empty{border:2px dashed rgba(255,255,255,.07);background:none;cursor:default;height:96px}
  .qitem.empty:hover{transform:none}
  .pbar{width:40px;height:5px;border-radius:3px;background:rgba(0,0,0,.4);overflow:hidden}
  .pbar i{display:block;height:100%;background:var(--accent)}
  .tag{font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.4px}
  #hint{margin-top:10px;min-height:22px;font-size:14px;color:var(--muted);transition:color .2s}
  #hint.bad{color:var(--bad)}
  #fact{margin-top:6px;font-size:12px;color:#6c7891;border-top:1px solid #1f2739;padding-top:8px}
  #fact b{color:var(--accent);font-weight:600}

  /* ---------- Popups, Banner, Overlay ---------- */
  .pop{position:fixed;z-index:60;pointer-events:none;font-weight:800;font-size:14px;white-space:nowrap;
    transform:translate(-50%,0);animation:rise 1.1s ease-out forwards;text-shadow:0 2px 4px rgba(0,0,0,.7)}
  .pop.good{color:var(--accent)} .pop.money{color:#ffd54a} .pop.bad{color:var(--bad)} .pop.info{color:#9fd3ff}
  #banner{position:fixed;left:50%;top:22%;transform:translate(-50%,-50%) scale(.6);opacity:0;z-index:70;pointer-events:none;
    background:linear-gradient(135deg,#ff4d5e,#ffb020);color:#160b00;font-weight:900;font-size:28px;padding:12px 26px;border-radius:14px;
    transition:all .3s;box-shadow:0 10px 30px rgba(0,0,0,.5)}
  #banner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
  #overlay{position:fixed;inset:0;background:rgba(6,9,16,.82);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
  #overlay.hidden{display:none}
  .card{background:var(--panel);border-radius:18px;max-width:560px;width:100%;padding:22px;max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.6)}
  .card h2{margin:0 0 6px;font-size:26px}
  .card p{color:#c3cbdb;line-height:1.5;margin:8px 0}
  .legend{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
  .legend div{background:var(--panel2);border-radius:10px;padding:8px 10px;font-size:13px;color:#c3cbdb}
  .legend b{color:var(--text)}
  .card .go{width:100%;margin-top:10px;padding:14px;font-size:17px;border-radius:12px;background:linear-gradient(135deg,#3ddc97,#2aa7ff);color:#08121f;font-weight:800}
  .results{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
  .results div{background:var(--panel2);border-radius:10px;padding:10px}
  .results small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.6px}
  .results b{font-size:20px}
  .stars{font-size:34px;letter-spacing:4px;margin:4px 0}
  .stars .off{opacity:.2}
  kbd{background:#0b0f18;border:1px solid #2f3850;border-radius:4px;padding:0 5px;font-size:12px}

  @keyframes blink{50%{opacity:.25}}
  @keyframes pulse{50%{transform:scale(1.2)}}
  @keyframes shake{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
  @keyframes rise{0%{opacity:0;margin-top:6px}15%{opacity:1}100%{opacity:0;margin-top:-46px}}

  @media (max-width:560px){
    h1{font-size:18px}
    .stat{min-width:0;padding:4px 8px}
    .stat b{font-size:14px}
    #garage{padding:8px}
    .lane{height:34px;font-size:16px}
    .lane span{top:-9px}
    .car .badge{font-size:9px;line-height:12px}
    .entry{grid-template-columns:1fr}
    .board{display:flex;gap:14px;align-items:center;justify-content:space-between}
    .board .big{font-size:20px}
    .qitem{width:calc((100% - 30px)/6);padding:4px 2px}
    .queue .car{width:24px} .queue .car.s{height:36px} .queue .car.m{height:44px} .queue .car.b{height:54px;width:27px}
    .pbar{width:90%}
    .qitem.empty{height:78px}
    .queue{min-height:84px}
    .legend,.results{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🅿️ Park<span>Pilot</span></h1>
    <div class="hud">
      <div class="stat"><small>Uhrzeit</small><b id="clock">06:00</b></div>
      <div class="stat"><small>Punkte</small><b id="score">0</b></div>
      <div class="stat"><small>Umsatz</small><b id="money">0 €</b></div>
      <div class="stat"><small>CO₂ gespart</small><b id="co2">0,0 kg</b></div>
      <div class="stat"><small>Zufriedenheit</small><b class="hearts" id="hearts"></b></div>
    </div>
    <div class="tools">
      <button class="btn ai" id="aiBtn" title="Taste K">🤖 KI-Zuweisung (3)</button>
      <button class="btn" id="pauseBtn" title="Taste P">❚❚</button>
      <button class="btn" id="muteBtn" title="Ton an/aus">🔊</button>
    </div>
  </header>

  <div id="garage"></div>

  <div class="entry">
    <div class="board">
      <div><div class="lbl">PARKLEITSYSTEM</div><div class="big" id="free">FREI 24</div></div>
      <div class="small" id="freeTypes">⚡ 4 · ♿ 2 · S 4</div>
    </div>
    <div class="lanebox">
      <div class="lbl"><span>🚧 Einfahrt – Warteschlange</span><span id="qcount">0 / 6</span></div>
      <div class="queue" id="queue"></div>
    </div>
  </div>

  <div id="hint">Wähle ein Auto an der Einfahrt und klicke dann auf einen freien Parkplatz.</div>
  <div id="fact"></div>
</div>

<div id="banner"></div>

<div id="overlay">
  <div class="card" id="card"></div>
</div>

<script>
(() => {
  // ---------- Konfiguration ----------
  const LAYOUT = ['DNNNNNEE', 'CCNNNNCC', 'EENNNNND'];
  const TYPES = { N: 'normal', E: 'ev', D: 'dis', C: 'compact' };
  const GROUND = { normal: '', ev: '⚡', dis: '♿', compact: 'S' };
  const COLORS = ['#e74c3c','#f1c40f','#ecf0f1','#2ecc71','#9b59b6','#e67e22','#1abc9c','#95a5a6','#5d6d7e','#ff7eb6','#c0392b','#16a085'];
  const DAY = 16 * 60;          // 06:00 – 22:00 in Spielminuten
  const MIN_PER_SEC = 6;        // 1 Sekunde = 6 Spielminuten
  const QUEUE_MAX = 6;
  const MAX_SAT = 5;
  const FACTS = [
    'Ein beträchtlicher Teil des Innenstadtverkehrs ist <b>Parksuchverkehr</b> – Smart Parking soll genau den vermeiden.',
    'Bodensensoren erkennen per <b>Magnetfeld</b> oder <b>Radar</b>, ob ein Fahrzeug über ihnen steht.',
    'Viele Parkhäuser zählen Fahrzeuge per <b>Kamera</b> und zeigen freie Plätze schon auf der Zufahrtsstraße an.',
    'Die grünen und roten Lämpchen über den Stellplätzen heißen <b>Einzelplatzanzeige</b>.',
    'Sensoren funken ihre Daten oft per <b>LoRaWAN</b> oder <b>NB-IoT</b> – energiesparend über weite Strecken.',
    'Mit Belegungsdaten lassen sich <b>dynamische Preise</b> umsetzen: teurer, wenn es voll ist.',
    'Apps können freie Plätze <b>reservieren</b> und Kennzeichen-Erkennung macht das Ticket überflüssig.',
    'Ladeplätze sind wertvoll: <b>Falschparker</b> auf E-Ladeplätzen blockieren die Infrastruktur.',
  ];

  const $ = s => document.querySelector(s);
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const rand = (a, b) => a + Math.random() * (b - a);
  const fmtMoney = v => v.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ' €';

  let S, muted = false, audio = null, lastTs = 0, bannerT = null, hintT = null;

  // ---------- Sound ----------
  function beep(freq, dur = .08, type = 'sine', vol = .06) {
    if (muted) return;
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, audio.currentTime);
      g.gain.exponentialRampToValueAtTime(.0001, audio.currentTime + dur);
      o.connect(g).connect(audio.destination);
      o.start(); o.stop(audio.currentTime + dur);
    } catch (e) {}
  }
  const chime = () => { beep(660, .07); setTimeout(() => beep(990, .09), 70); };

  // ---------- Zustand ----------
  function newState() {
    return {
      spots: [], queue: [], sel: null, t: 0, score: 0, money: 0, co2: 0, sat: MAX_SAT, assist: 3,
      parked: 0, angry: 0, towed: 0, fixed: 0, charged: 0, carId: 0,
      nextSpawn: 1, nextFault: rand(14, 22), nextIllegal: rand(20, 30),
      running: false, paused: false, rush: false, factT: 0, factI: Math.floor(Math.random() * FACTS.length),
    };
  }

  function makeCar() {
    const r = Math.random();
    const kind = r < .27 ? 'ev' : r < .37 ? 'dis' : 'std';
    const s = Math.random();
    let size = s < .32 ? 's' : s < .8 ? 'm' : 'b';
    if (kind === 'dis') size = 'm';
    const maxP = 15 - 4 * (S.t / DAY);
    return { id: ++S.carId, kind, size, color: pick(COLORS), pat: maxP, maxP, dur: rand(18, 42) };
  }

  const badge = c => c.kind === 'ev' ? '<span class="badge">⚡</span>' : c.kind === 'dis' ? '<span class="badge">♿</span>' : '';
  const carHTML = c => `<div class="car ${c.size}" style="--c:${c.color}">${badge(c)}</div>`;
  const sizeName = { s: 'Kleinwagen', m: 'Mittelklasse', b: 'SUV / Transporter' };
  const tag = c => ({ s: 'S', m: 'M', b: 'XL' })[c.size] + (c.kind === 'ev' ? ' ⚡' : c.kind === 'dis' ? ' ♿' : '');

  function describe(c) {
    const want = c.kind === 'ev' ? 'möchte laden ⚡' : c.kind === 'dis' ? 'hat Behindertenausweis ♿' : 'sucht einen Platz';
    return `${sizeName[c.size]}${c.kind === 'ev' ? ' (E-Auto)' : ''} – ${want}. Klicke auf einen grün markierten Platz.`;
  }

  function reason(car, sp) {
    if (sp.broken) return sp.repair ? 'Sensor wird gerade repariert …' : 'Sensor defekt – erst reparieren (Platz anklicken)!';
    if (sp.car) return sp.illegal ? 'Falschparker! Platz anklicken zum Abschleppen.' : 'Platz ist belegt.';
    if (sp.type === 'dis' && car.kind !== 'dis') return 'Nur für Fahrzeuge mit Behindertenausweis ♿.';
    if (sp.type === 'ev' && car.kind !== 'ev') return 'Ladeplatz ⚡ – nur für E-Autos.';
    if (sp.type === 'compact' && car.size === 'b') return 'Zu groß für den Kompaktplatz!';
    return '';
  }

  // ---------- Aufbau ----------
  function buildGarage() {
    const g = $('#garage');
    g.innerHTML = '';
    LAYOUT.forEach((row, r) => {
      const rowEl = document.createElement('div');
      rowEl.className = 'row ' + (r === 0 ? 'top' : r === LAYOUT.length - 1 ? 'bottom' : 'mid');
      [...row].forEach(ch => {
        const sp = { id: S.spots.length, type: TYPES[ch], car: null, broken: false, repair: 0, illegal: false, arriving: false };
        const el = document.createElement('div');
        el.className = 'spot t-' + sp.type;
        el.innerHTML = `<div class="ground">${GROUND[sp.type]}</div><div class="sensor"></div><div class="slot"></div><div class="tbar"><i></i></div><div class="flag"></div>`;
        el.addEventListener('click', () => onSpot(sp));
        sp.el = el; sp.slot = el.querySelector('.slot'); sp.bar = el.querySelector('.tbar i'); sp.flag = el.querySelector('.flag');
        rowEl.appendChild(el);
        S.spots.push(sp);
      });
      g.appendChild(rowEl);
      if (r < LAYOUT.length - 1) {
        const lane = document.createElement('div');
        lane.className = 'lane';
        lane.innerHTML = '<span>➜</span><span>➜</span><span>➜</span><span>➜</span>';
        g.appendChild(lane);
      }
    });
  }

  // ---------- Darstellung ----------
  function renderSpot(sp) {
    const el = sp.el;
    el.classList.toggle('occ', !!sp.car);
    el.classList.toggle('broken', sp.broken);
    el.classList.toggle('repairing', sp.broken && sp.repair > 0);
    el.classList.toggle('illegal', sp.illegal);
    sp.slot.innerHTML = sp.car && !sp.arriving ? carHTML(sp.car) : '';
    sp.flag.textContent = sp.illegal ? '🚫' : sp.broken ? (sp.repair > 0 ? '🔧' : '⚠️') : '';
  }

  function renderHighlights() {
    const car = S.queue.find(c => c.id === S.sel);
    for (const sp of S.spots) {
      const free = !sp.car && !sp.broken;
      sp.el.classList.toggle('ok', !!car && free && !reason(car, sp));
      sp.el.classList.toggle('no', !!car && free && !!reason(car, sp));
    }
  }

  function renderQueue() {
    const q = $('#queue');
    let html = S.queue.map(c =>
      `<div class="qitem ${c.id === S.sel ? 'sel' : ''}" data-car="${c.id}">${carHTML(c)}<div class="pbar"><i></i></div><div class="tag">${tag(c)}</div></div>`
    ).join('');
    for (let i = S.queue.length; i < QUEUE_MAX; i++) html += '<div class="qitem empty"></div>';
    q.innerHTML = html;
    for (const c of S.queue) c.pEl = q.querySelector(`[data-car="${c.id}"] .pbar i`);
    $('#qcount').textContent = `${S.queue.length} / ${QUEUE_MAX}`;
    updateBars();
    renderHighlights();
  }

  function renderBoard() {
    const free = S.spots.filter(s => !s.car && !s.broken);
    const n = t => free.filter(s => s.type === t).length;
    $('#free').textContent = free.length ? `FREI ${String(free.length).padStart(2, '0')}` : 'BESETZT';
    $('#freeTypes').textContent = `⚡ ${n('ev')} · ♿ ${n('dis')} · S ${n('compact')}`;
  }

  function renderHud() {
    const m = 6 * 60 + Math.floor(S.t);
    $('#clock').textContent = `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;
    $('#score').textContent = S.score;
    $('#money').textContent = fmtMoney(S.money);
    $('#co2').textContent = S.co2.toFixed(1).replace('.', ',') + ' kg';
    $('#hearts').innerHTML = Array.from({ length: MAX_SAT }, (_, i) => `<i class="${i < S.sat ? '' : 'off'}">♥</i>`).join('');
    const ai = $('#aiBtn');
    ai.textContent = `🤖 KI-Zuweisung (${S.assist})`;
    ai.disabled = S.assist <= 0;
  }

  function updateBars() {
    for (const c of S.queue) {
      if (!c.pEl) continue;
      const r = Math.max(0, c.pat / c.maxP);
      c.pEl.style.width = (r * 100) + '%';
      c.pEl.style.background = r > .5 ? 'var(--accent)' : r > .25 ? 'var(--warn)' : 'var(--bad)';
    }
    for (const sp of S.spots) {
      if (sp.broken && sp.repair > 0) sp.bar.style.width = (100 - sp.repair / 1.6 * 100) + '%';
      else if (sp.car && !sp.illegal) sp.bar.style.width = (Math.max(0, sp.car.left / sp.car.dur) * 100) + '%';
      else if (sp.illegal) sp.bar.style.width = '0%';
    }
  }

  function hint(text, bad = false) {
    const h = $('#hint');
    h.textContent = text;
    h.classList.toggle('bad', bad);
    clearTimeout(hintT);
    if (bad) hintT = setTimeout(() => h.classList.remove('bad'), 1600);
  }

  function popup(target, text, cls) {
    const r = target.getBoundingClientRect();
    const p = document.createElement('div');
    p.className = 'pop ' + cls;
    p.textContent = text;
    p.style.left = (r.left + r.width / 2) + 'px';
    p.style.top = (r.top + r.height * .3) + 'px';
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 1150);
  }

  function banner(text) {
    const b = $('#banner');
    b.textContent = text;
    b.classList.add('show');
    clearTimeout(bannerT);
    bannerT = setTimeout(() => b.classList.remove('show'), 2200);
  }

  function shake(el) {
    el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
  }

  // Auto fliegt von der Einfahrt auf den Stellplatz
  function fly(from, sp, car, done) {
    if (!from) { done(); return; }
    const r = sp.el.getBoundingClientRect();
    const hf = { s: .5, m: .64, b: .8 }[car.size], wf = car.size === 'b' ? .72 : .64;
    const w = r.width * wf, h = r.height * hf;
    const el = document.createElement('div');
    el.className = 'car fly ' + car.size;
    el.style.cssText = `--c:${car.color};left:${from.left}px;top:${from.top}px;width:${from.width}px;height:${from.height}px`;
    el.innerHTML = badge(car);
    document.body.appendChild(el);
    requestAnimationFrame(() => requestAnimationFrame(() => {
      el.style.left = (r.left + (r.width - w) / 2) + 'px';
      el.style.top = (r.top + (r.height - h) / 2) + 'px';
      el.style.width = w + 'px';
      el.style.height = h + 'px';
    }));
    setTimeout(() => { el.remove(); done(); }, 540);
  }

  // Auto fährt davon (ausparken, abschleppen, verärgert abfahren)
  function ghost(srcEl, car, dy = -50) {
    const src = srcEl && srcEl.querySelector('.car');
    if (!src) return;
    const r = src.getBoundingClientRect();
    const el = document.createElement('div');
    el.className = 'car ghost ' + car.size;
    el.style.cssText = `--c:${car.color};left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px`;
    el.innerHTML = badge(car);
    document.body.appendChild(el);
    requestAnimationFrame(() => requestAnimationFrame(() => {
      el.style.transform = `translateY(${dy}px)`;
      el.style.opacity = '0';
    }));
    setTimeout(() => el.remove(), 650);
  }

  // ---------- Aktionen ----------
  function selectCar(id) {
    S.sel = id;
    const car = S.queue.find(c => c.id === id);
    renderQueue();
    if (car) { hint(describe(car)); beep(520, .04); }
  }

  function onSpot(sp) {
    if (!S.running || S.paused) return;
    if (sp.illegal) { tow(sp); return; }
    if (sp.broken) {
      if (!sp.repair) { sp.repair = 1.6; renderSpot(sp); hint('🔧 Techniker unterwegs – Sensor wird kalibriert …'); beep(400, .06, 'triangle'); }
      return;
    }
    const car = S.queue.find(c => c.id === S.sel);
    if (!car) { if (!sp.car) hint('Wähle zuerst ein Auto an der Einfahrt aus.', true); return; }
    const why = reason(car, sp);
    if (why) { shake(sp.el); hint(why, true); beep(150, .14, 'square', .04); return; }
    park(car, sp);
  }

  function park(car, sp) {
    const qEl = document.querySelector(`[data-car="${car.id}"] .car`);
    const from = qEl ? qEl.getBoundingClientRect() : null;
    S.queue = S.queue.filter(c => c !== car);
    car.left = car.dur;
    sp.car = car;
    sp.arriving = true;

    const ratio = Math.max(0, car.pat / car.maxP);
    let bonus = 0, msg = '';
    if (sp.type === 'ev') { bonus = 15; msg = '⚡ lädt'; S.charged++; }
    else if (sp.type === 'dis') { bonus = 15; msg = '♿ perfekt'; }
    else if (sp.type === 'compact' && car.size === 's') { bonus = 6; msg = 'passt genau'; }
    else if (car.kind === 'ev') { msg = 'ohne Laden'; }
    const pts = 10 + bonus + Math.round(12 * ratio);
    S.score += pts;
    S.parked++;
    S.co2 += .3 + .9 * ratio; // kurze Wartezeit = weniger Suchverkehr

    if (S.sel === car.id || !S.queue.some(c => c.id === S.sel)) S.sel = S.queue.length ? S.queue[0].id : null;
    renderSpot(sp);
    renderQueue();
    renderBoard();
    renderHud();
    const next = S.queue.find(c => c.id === S.sel);
    hint(next ? describe(next) : 'Alle Autos versorgt. 👌');
    fly(from, sp, car, () => {
      if (sp.car !== car) return;
      sp.arriving = false;
      renderSpot(sp);
      popup(sp.el, `+${pts}${msg ? ' ' + msg : ''}`, 'good');
    });
    chime();
  }

  function leave(sp) {
    const car = sp.car;
    let fee = 1.5 + car.dur * .11;
    if (sp.type === 'ev') fee += 4; // Ladestrom
    S.money += fee;
    ghost(sp.el, car);
    sp.car = null;
    renderSpot(sp);
    renderHighlights();
    renderBoard();
    renderHud();
    popup(sp.el, `+${fee.toFixed(2).replace('.', ',')} €`, 'money');
    beep(1200, .05, 'sine', .03);
  }

  function tow(sp) {
    const car = sp.car;
    ghost(sp.el, car, 60);
    sp.car = null;
    sp.illegal = false;
    S.score += 20;
    S.money += 55;
    S.towed++;
    renderSpot(sp);
    renderHighlights();
    renderBoard();
    renderHud();
    popup(sp.el, '🚛 Abgeschleppt +20', 'info');
    hint('Falschparker entfernt – 55 € Verwarngeld kassiert.');
    beep(220, .12, 'sawtooth', .04); setTimeout(() => beep(330, .12, 'sawtooth', .04), 120);
  }

  function assist() {
    if (!S.running || S.paused || S.assist <= 0) return;
    if (!S.queue.length) { hint('Keine Autos in der Warteschlange.', true); return; }
    S.assist--;
    let placed = 0;
    for (const car of [...S.queue].sort((a, b) => a.pat - b.pat)) {
      let best = null, bs = -1;
      for (const sp of S.spots) {
        if (reason(car, sp)) continue;
        let s = 2;
        if (sp.type === 'ev' || sp.type === 'dis') s = 10;
        else if (sp.type === 'compact') s = car.size === 's' ? 6 : 1;
        else if (car.size === 's') s = 1.5;
        if (s > bs) { bs = s; best = sp; }
      }
      if (best) { park(car, best); placed++; }
    }
    renderHud();
    hint(`🤖 KI hat ${placed} Auto${placed === 1 ? '' : 's'} optimal verteilt.`);
  }

  function loseSat(target, text) {
    S.sat--;
    S.angry++;
    popup(target, text, 'bad');
    beep(120, .25, 'sawtooth', .05);
    renderHud();
    if (S.sat <= 0) end(false);
  }

  // ---------- Ereignisse ----------
  function sensorFault() {
    const c = S.spots.filter(s => !s.car && !s.broken && (s.type === 'normal' || s.type === 'compact'));
    if (!c.length) return;
    const sp = pick(c);
    sp.broken = true;
    sp.repair = 0;
    renderSpot(sp); renderHighlights(); renderBoard();
    hint('⚠️ Sensorstörung! Klicke auf den Platz, um ihn zu reparieren.', true);
    beep(700, .08, 'square', .03); setTimeout(() => beep(700, .08, 'square', .03), 140);
  }

  function illegalParker() {
    const c = S.spots.filter(s => !s.car && !s.broken && (s.type === 'ev' || s.type === 'dis'));
    if (!c.length) return;
    const sp = pick(c);
    sp.car = { id: ++S.carId, kind: 'std', size: Math.random() < .5 ? 'm' : 'b', color: pick(COLORS), dur: 1, left: 1 };
    sp.illegal = true;
    renderSpot(sp); renderHighlights(); renderBoard();
    hint(`🚫 Falschparker auf einem ${sp.type === 'ev' ? 'Ladeplatz' : 'Behindertenparkplatz'}! Anklicken zum Abschleppen.`, true);
    beep(300, .15, 'square', .04);
  }

  // ---------- Spielschleife ----------
  function step(dt) {
    S.t += dt * MIN_PER_SEC;
    const hour = 6 + S.t / 60;
    const rush = (hour >= 7 && hour < 9) || (hour >= 16 && hour < 18);
    if (rush && !S.rush) { banner('🚦 Rush Hour!'); beep(500, .1, 'square', .04); }
    S.rush = rush;

    // Ankünfte
    S.nextSpawn -= dt;
    if (S.nextSpawn <= 0) {
      const prog = S.t / DAY;
      S.nextSpawn = (4.2 - 1.6 * prog) * (rush ? .58 : 1) * rand(.75, 1.25);
      if (S.queue.length >= QUEUE_MAX) {
        loseSat($('#queue'), '🚗💨 Rückstau!');
        hint('Rückstau bis auf die Straße! Ein Autofahrer ist weitergefahren.', true);
      } else {
        S.queue.push(makeCar());
        if (!S.queue.some(c => c.id === S.sel)) S.sel = S.queue[0].id;
        renderQueue();
        if (S.queue.length === 1) hint(describe(S.queue[0]));
      }
    }

    // Geduld in der Warteschlange
    for (const c of [...S.queue]) {
      c.pat -= dt;
      if (c.pat <= 0) {
        const el = document.querySelector(`[data-car="${c.id}"]`);
        if (el) ghost(el, c, 40);
        S.queue = S.queue.filter(x => x !== c);
        if (S.sel === c.id) S.sel = S.queue.length ? S.queue[0].id : null;
        renderQueue();
        loseSat(el || $('#queue'), '😠 Zu lange gewartet!');
        if (!S.running) return;
      }
    }

    // Parkende Autos und Reparaturen
    for (const sp of S.spots) {
      if (sp.car && !sp.illegal && !sp.arriving) {
        sp.car.left -= dt;
        if (sp.car.left <= 0) leave(sp);
      }
      if (sp.broken && sp.repair > 0) {
        sp.repair -= dt;
        if (sp.repair <= 0) {
          sp.broken = false; sp.repair = 0;
          S.score += 5; S.fixed++;
          renderSpot(sp); renderHighlights(); renderBoard();
          popup(sp.el, '✅ Sensor ok +5', 'info');
          beep(880, .06, 'triangle');
        }
      }
    }

    // Störungen
    S.nextFault -= dt;
    if (S.nextFault <= 0) { S.nextFault = rand(14, 26); sensorFault(); }
    S.nextIllegal -= dt;
    if (S.nextIllegal <= 0) { S.nextIllegal = rand(18, 32); illegalParker(); }

    // Faktenticker
    S.factT -= dt;
    if (S.factT <= 0) { S.factT = 14; S.factI = (S.factI + 1) % FACTS.length; $('#fact').innerHTML = '💡 ' + FACTS[S.factI]; }

    updateBars();
    renderHud();
    if (S.t >= DAY) end(true);
  }

  function loop(ts) {
    const dt = Math.min(.1, (ts - lastTs) / 1000 || 0);
    lastTs = ts;
    if (S.running && !S.paused) step(dt);
    requestAnimationFrame(loop);
  }

  // ---------- Start / Ende ----------
  function readBest() { try { return +localStorage.getItem('parkpilot-best') || 0; } catch (e) { return 0; } }
  function writeBest(v) { try { localStorage.setItem('parkpilot-best', v); } catch (e) {} }

  function showIntro() {
    const best = readBest();
    $('#card').innerHTML = `
      <h2>🅿️ ParkPilot</h2>
      <p>Du bist die <b>Smart-Parking-Leitzentrale</b> des Parkhauses „Am Marktplatz“. Sensoren melden dir jeden freien Platz –
      jetzt musst du die ankommenden Autos von 06:00 bis 22:00 Uhr schnell und clever einweisen, bevor die Fahrer die Geduld verlieren.</p>
      <div class="legend">
        <div><b>1.</b> Auto an der Einfahrt anklicken (oder <kbd>1</kbd>–<kbd>6</kbd>)</div>
        <div><b>2.</b> Grün markierten Platz anklicken</div>
        <div><b>⚡ Ladeplatz</b> – nur E-Autos, großer Bonus</div>
        <div><b>♿ Behindertenplatz</b> – nur mit Ausweis, Bonus</div>
        <div><b>S Kompaktplatz</b> – kein SUV / Transporter</div>
        <div><b>⚠️ Sensorstörung</b> – Platz anklicken zum Reparieren</div>
        <div><b>🚫 Falschparker</b> – anklicken, abschleppen lassen</div>
        <div><b>🤖 KI-Zuweisung</b> (<kbd>K</kbd>) – verteilt alle Wartenden, nur 3×</div>
      </div>
      <p>Wartet jemand zu lange oder staut es sich bis auf die Straße, sinkt die Zufriedenheit ♥. Bei null ist Schicht­ende!
      Schnelles Einparken spart Parksuchverkehr – und damit CO₂.</p>
      ${best ? `<p>🏆 Dein Rekord: <b>${best} Punkte</b></p>` : ''}
      <button class="go" id="goBtn">Schicht starten 🚦</button>`;
    $('#overlay').classList.remove('hidden');
    $('#goBtn').onclick = start;
  }

  function start() {
    S = newState();
    buildGarage();
    S.spots.forEach(renderSpot);
    renderQueue(); renderBoard(); renderHud();
    $('#fact').innerHTML = '💡 ' + FACTS[S.factI];
    S.factT = 14;
    hint('Die ersten Autos kommen gleich an …');
    $('#overlay').classList.add('hidden');
    $('#pauseBtn').textContent = '❚❚';
    S.running = true;
    beep(440, .08); setTimeout(() => beep(660, .08), 90); setTimeout(() => beep(880, .12), 180);
  }

  function end(survived) {
    S.running = false;
    document.querySelectorAll('.car.fly,.car.ghost').forEach(e => e.remove());
    let stars = 0;
    if (survived) stars = 1 + (S.sat >= 3 ? 1 : 0) + (S.sat >= 5 || (S.sat >= 4 && S.score >= 1800) ? 1 : 0);
    const best = readBest();
    const record = S.score > best;
    if (record) writeBest(S.score);
    const title = survived
      ? (stars === 3 ? 'Meister der Parkleitzentrale! 🏆' : stars === 2 ? 'Starke Schicht! 👏' : 'Geschafft – knapp! 😅')
      : 'Schicht abgebrochen 😬';
    const text = survived
      ? 'Das Parkhaus schließt um 22:00 Uhr. Hier ist deine Tagesbilanz:'
      : 'Zu viele genervte Autofahrer – die Stadtverwaltung hat übernommen. So weit bist du gekommen:';
    $('#card').innerHTML = `
      <h2>${title}</h2>
      <div class="stars">${[0, 1, 2].map(i => `<span class="${i < stars ? '' : 'off'}">⭐</span>`).join('')}</div>
      <p>${text}</p>
      <div class="results">
        <div><small>Punkte</small><b>${S.score}</b>${record ? ' 🏆 Rekord!' : ''}</div>
        <div><small>Umsatz</small><b>${fmtMoney(S.money)}</b></div>
        <div><small>Eingeparkt</small><b>${S.parked}</b> Autos</div>
        <div><small>Davon geladen ⚡</small><b>${S.charged}</b></div>
        <div><small>Abgeschleppt 🚛</small><b>${S.towed}</b></div>
        <div><small>Sensoren repariert 🔧</small><b>${S.fixed}</b></div>
        <div><small>Verärgerte Fahrer</small><b>${S.angry}</b></div>
        <div><small>CO₂ gespart</small><b>${S.co2.toFixed(1).replace('.', ',')} kg</b></div>
      </div>
      <button class="go" id="goBtn">Neue Schicht 🔁</button>`;
    $('#overlay').classList.remove('hidden');
    $('#goBtn').onclick = start;
    if (survived) { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, .15), i * 120)); }
    else { [400, 300, 200].forEach((f, i) => setTimeout(() => beep(f, .2, 'sawtooth', .04), i * 160)); }
  }

  function togglePause(force) {
    if (!S.running) return;
    S.paused = force !== undefined ? force : !S.paused;
    $('#pauseBtn').textContent = S.paused ? '▶️' : '❚❚';
    if (S.paused) hint('Pause – klicke ▶️ oder drücke P zum Weiterspielen.');
  }

  // ---------- Eingaben ----------
  $('#queue').addEventListener('click', e => {
    const item = e.target.closest('.qitem[data-car]');
    if (item && S.running && !S.paused) selectCar(+item.dataset.car);
  });
  $('#aiBtn').onclick = assist;
  $('#pauseBtn').onclick = () => togglePause();
  $('#muteBtn').onclick = () => { muted = !muted; $('#muteBtn').textContent = muted ? '🔇' : '🔊'; };
  document.addEventListener('keydown', e => {
    if (!S || !S.running) return;
    const k = e.key.toLowerCase();
    if (k === 'p') togglePause();
    else if (S.paused) return;
    else if (k === 'k') assist();
    else if (/^[1-6]$/.test(k)) { const c = S.queue[+k - 1]; if (c) selectCar(c.id); }
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden && S && S.running) togglePause(true); });

  // ---------- Los geht's ----------
  S = newState();
  buildGarage();
  S.spots.forEach(renderSpot);
  renderQueue(); renderBoard(); renderHud();
  $('#fact').innerHTML = '💡 ' + FACTS[S.factI];
  showIntro();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
