<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      background-color: #f4f7f6;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .admin-container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 45, 86, 0.08);
      width: 100%;
      max-width: 900px;
      overflow: hidden;
      border-top: 6px solid #002d56;
    }
    .admin-header {
      padding: 30px 40px;
      background-color: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .admin-header h1 {
      margin: 0;
      color: #002d56;
      font-size: 24px;
    }
    .logo {
      max-width: 180px;
      height: auto;
    }
    .admin-body {
      padding: 40px;
    }
    
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 25px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
    }
    .form-group.full-width {
      grid-column: span 2;
    }
    
    label {
      margin-bottom: 8px;
      font-weight: 600;
      color: #4a5568;
      font-size: 14px;
    }
    input[type="text"], input[type="email"], textarea {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
      box-sizing: border-box;
      background-color: #fdfdfd;
      transition: all 0.2s;
      font-family: inherit;
    }
    input:focus, textarea:focus {
      border-color: #ff6600;
      box-shadow: 0 0 0 3px rgba(255, 102, 0, 0.1);
      outline: none;
    }
    textarea {
      resize: vertical;
      min-height: 100px;
    }
    .required-asterisk {
      color: #e53e3e;
    }

    .form-actions {
      margin-top: 40px;
      display: flex;
      justify-content: flex-end;
      gap: 15px;
      border-top: 1px solid #e2e8f0;
      padding-top: 25px;
    }
    
    button.btn-submit {
      padding: 12px 28px;
      background-color: #ff6600;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(255, 102, 0, 0.2);
      transition: background-color 0.2s, transform 0.1s;
    }
    button.btn-submit:hover { background-color: #e65c00; }
    button.btn-submit:active { transform: translateY(2px); }
    button.btn-submit:disabled {
      background-color: #cbd5e1;
      cursor: not-allowed;
      box-shadow: none;
    }
    button.btn-reset {
      padding: 12px 20px;
      background-color: white;
      color: #64748b;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    button.btn-reset:hover {
      background-color: #f1f5f9;
      color: #0f172a;
    }

    .toast {
      position: fixed;
      bottom: 30px;
      right: 30px;
      padding: 16px 24px;
      border-radius: 8px;
      color: white;
      font-weight: 600;
      font-size: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      z-index: 1000;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.success { background-color: #4caf50; }
    .toast.error { background-color: #e53e3e; }
    
    @media (max-width: 768px) {
      .form-grid { grid-template-columns: 1fr; }
      .form-group.full-width { grid-column: span 1; }
      .admin-header { flex-direction: column; gap: 15px; text-align: center; }
    }
  </style>
</head>
<body>

<div class="admin-container">
  <div class="admin-header">
    <h1>Projekt für Techniker Bereitstellen</h1>
    <img src="https://www.smartparking.com/wp-content/uploads/2025/04/logo.svg" alt="Smart Parking Logo" class="logo">
  </div>
  
  <div class="admin-body">
    <form id="projectForm">
      <div class="form-grid">
        
        <div class="form-group">
          <label for="projectName">Projektname <span class="required-asterisk">*</span></label>
          <input type="text" id="projectName" required placeholder="z.B. Parkplatz Nord">
        </div>
        
        <div class="form-group">
          <label for="projectId">Ordner ID / Projektnummer <span class="required-asterisk">*</span></label>
          <input type="text" id="projectId" required placeholder="z.B. P-2026-001">
        </div>

        <div class="form-group full-width">
          <label for="projectAddress">Adresse</label>
          <input type="text" id="projectAddress" placeholder="Straße, PLZ Ort">
        </div>
        
        <div class="form-group">
          <label for="projectContact">Ansprechpartner</label>
          <input type="text" id="projectContact" placeholder="Name der Kontaktperson">
        </div>

        <div class="form-group">
          <label for="projectPhone">Telefonnummer</label>
          <input type="text" id="projectPhone" placeholder="+49 ...">
        </div>

        <div class="form-group">
          <label for="projectEmail">E-Mail</label>
          <input type="email" id="projectEmail" placeholder="mail@beispiel.de">
        </div>

        <div class="form-group full-width">
          <label for="projectNotes">Notizen & Infos</label>
          <textarea id="projectNotes" placeholder="Zusätzliche Informationen für den Techniker..."></textarea>
        </div>
        
      </div>
      
      <div class="form-actions">
        <button type="button" class="btn-reset" onclick="resetForm()">Formular leeren</button>
        <button type="submit" class="btn-submit" id="submitBtn">Projekt speichern</button>
      </div>
    </form>
  </div>
</div>

<div id="toastMessage" class="toast"></div>

<script>
  function resetForm() {
    document.getElementById('projectForm').reset();
  }

  // Formular absenden
  document.getElementById('projectForm').addEventListener('submit', function(e) {
    e.preventDefault();

    var submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    submitBtn.innerText = 'Speichert Projekt...';

    var data = {
      name: document.getElementById('projectName').value.trim(),
      id: document.getElementById('projectId').value.trim(),
      ansprechpartner: document.getElementById('projectContact').value.trim(),
      telefon: document.getElementById('projectPhone').value.trim(),
      email: document.getElementById('projectEmail').value.trim(),
      adresse: document.getElementById('projectAddress').value.trim(),
      notizen: document.getElementById('projectNotes').value.trim()
    };

    google.script.run
      .withSuccessHandler(function(response) {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Projekt speichern';

        if(response.status === 'success') {
          showToast(response.message, 'success');
          resetForm();
        } else {
          showToast(response.message, 'error');
        }
      })
      .withFailureHandler(function(error) {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Projekt speichern';
        showToast('Systemfehler: ' + error.message, 'error');
      })
      .saveNewProject(data);
  });

  function showToast(message, type) {
    var toast = document.getElementById('toastMessage');
    toast.innerText = message;
    toast.className = 'toast show ' + type;
    
    setTimeout(function() {
      toast.className = 'toast ' + type;
    }, 4000);
  }
</script>

</body>
</html>
